version: '3.9'

services:
  # ─────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lianka_postgres
    restart: always
    environment:
      POSTGRES_DB: lianka
      POSTGRES_USER: lianka_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    networks:
      - lianka_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lianka_user -d lianka"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Redis — Session cache + job queue
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lianka_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - lianka_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # NestJS Backend API
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lianka_backend
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://lianka_user:${DB_PASSWORD}@postgres:5432/lianka
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: lianka_user
      DB_PASS: ${DB_PASSWORD}
      DB_NAME: lianka
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: 30d
      GMAIL_USER: bcebrain@gmail.com
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      DEPOSIT_ADDRESS_TRC20: TDFeZPisd4Rs31pkVCPGhz6QB6Y349jqHQ
      DEPOSIT_ADDRESS_BEP20: "0x1c9E87A2bE00A7bE0D76aEc122c2774DF996462D"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lianka_network

  # ─────────────────────────────────────────
  # Next.js Frontend
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lianka_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_APP_NAME: Lianka
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - lianka_network

  # ─────────────────────────────────────────
  # Nginx Reverse Proxy
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: lianka_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - certbot_data:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - backend
      - frontend
    networks:
      - lianka_network

volumes:
  postgres_data:
  redis_data:
  certbot_data:
  certbot_certs:

networks:
  lianka_network:
    driver: bridge
